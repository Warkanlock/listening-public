import java.nio.file.Files
import java.nio.file.StandardCopyOption
import groovy.json.JsonOutput

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'music.listening.room'
    compileSdk 35
    defaultConfig {
        applicationId 'music.listening.room'
        minSdk 26
        targetSdk 35
        versionCode 20001
        versionName '2.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

abstract class CopyLauncherIcon extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getArtwork()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void copyIcon() {
        def icon = outputDirectory.file('mipmap-nodpi/ic_launcher.png').get().asFile.toPath()
        Files.createDirectories(icon.parent)
        Files.copy(artwork.get().asFile.toPath(), icon, StandardCopyOption.REPLACE_EXISTING)
    }
}

abstract class GenerateRoomPalettes extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getStylesheet()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void generatePalettes() {
        def palettes = [:]
        def rules = stylesheet.get().asFile.getText('UTF-8') =~ /\[data-palette="([a-z-]+)"\]\s*\{([^}]+)\}/
        rules.each { rule ->
            def tokens = [:]
            (rule[2] =~ /--([a-z0-9-]+):\s*(#[0-9a-fA-F]{6})\s*;/).each { token ->
                tokens[token[1]] = token[2]
            }
            palettes[rule[1]] = tokens
        }
        def keys = ['text', 'panel', 'card', 'tint', 'muted', 'accent', 'accent-ink',
                    'on-accent', 'line-strong', 'control-edge', 'accent-tint']
        ['sea-glass', 'night', 'paper'].each { theme ->
            if (!palettes[theme]?.keySet()?.containsAll(keys)) {
                throw new GradleException("Missing native room palette colors for ${theme}.")
            }
        }
        def asset = outputDirectory.file('room-palettes.json').get().asFile
        asset.parentFile.mkdirs()
        asset.setText(JsonOutput.toJson(palettes), 'UTF-8')
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def icon = tasks.register("copy${variant.name.capitalize()}LauncherIcon", CopyLauncherIcon) {
            artwork.set(rootProject.layout.projectDirectory.file('../../frontend/react/public/assets/icons/icon-512.png'))
        }
        variant.sources.res.addGeneratedSourceDirectory(icon) { it.outputDirectory }
        def palettes = tasks.register("generate${variant.name.capitalize()}RoomPalettes", GenerateRoomPalettes) {
            stylesheet.set(rootProject.layout.projectDirectory.file('../../frontend/react/src/room-palettes.css'))
        }
        variant.sources.assets.addGeneratedSourceDirectory(palettes) { it.outputDirectory }
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-session:1.6.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.6.1'
}
